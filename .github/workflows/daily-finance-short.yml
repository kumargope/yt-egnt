name: Daily Finance Short Auto-Publisher

# Triggers every day at 6:00 PM IST (18:00 IST = 12:30 UTC)
# Also supports manual trigger from GitHub Actions tab (Run workflow)
on:
  schedule:
    - cron: '30 12 * * *' # 12:30 UTC = 6:00 PM IST (Indian Standard Time)
  workflow_dispatch:
    inputs:
      auto_upload:
        description: 'Upload directly to YouTube'
        required: true
        type: boolean
        default: true
      privacy_status:
        description: 'Video Privacy Status'
        required: false
        type: choice
        options:
          - public
          - unlisted
          - private
        default: public

permissions:
  contents: write

jobs:
  build-and-publish:
    name: Generate Video, SEO & Publish to YouTube
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install System Dependencies (FFmpeg & Hindi Fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-deva fonts-indic fonts-noto-core

      - name: Install NPM Dependencies
        run: |
          npm ci || npm install

      - name: Generate 30-Sec Finance Short & Upload to YouTube
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY_STATUS: ${{ github.event.inputs.privacy_status || secrets.YOUTUBE_PRIVACY_STATUS || 'public' }}
          AUTO_UPLOAD: ${{ github.event.inputs.auto_upload != 'false' && 'true' || 'true' }}
        run: |
          node run-daily-short.js --upload

      - name: Commit and Push Updated Serial Tracker
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add serial_tracker.json output_videos/*.seo.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto-increment serial tracker after daily YouTube upload [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi
